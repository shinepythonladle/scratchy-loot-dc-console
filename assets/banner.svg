<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b12"/>
      <stop offset="45%" stop-color="#1a1420"/>
      <stop offset="100%" stop-color="#0b0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a2a12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d67a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9971f" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative scratch lines -->
  <g stroke="#f5d67a" stroke-width="2" opacity="0.12">
    <line x1="60" y1="40" x2="180" y2="20"/>
    <line x1="70" y1="60" x2="200" y2="40"/>
    <line x1="80" y1="80" x2="210" y2="60"/>
    <line x1="1000" y1="300" x2="1130" y2="330"/>
    <line x1="990" y1="320" x2="1120" y2="350"/>
    <line x1="980" y1="340" x2="1110" y2="360"/>
  </g>

  <!-- coin shapes -->
  <circle cx="130" cy="270" r="60" fill="url(#coin)"/>
  <circle cx="130" cy="270" r="60" fill="none" stroke="#f5d67a" stroke-width="1.5" opacity="0.25"/>
  <circle cx="1080" cy="90" r="50" fill="url(#coin)"/>
  <circle cx="1080" cy="90" r="50" fill="none" stroke="#f5d67a" stroke-width="1.5" opacity="0.25"/>

  <circle cx="250" cy="60" r="3" fill="#f5d67a" opacity="0.3"/>
  <circle cx="950" cy="250" r="4" fill="#f5d67a" opacity="0.25"/>
  <circle cx="300" cy="300" r="2.5" fill="#f5d67a" opacity="0.3"/>
  <circle cx="900" cy="60" r="2" fill="#f5d67a" opacity="0.3"/>

  <path d="M 40 180 Q 600 120 1160 180" stroke="#f5d67a" stroke-width="1" fill="none" opacity="0.1"/>

  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Scratchy Loot Script</tspan>
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Console script for Discord loot bots — automates Scratchy Loot draws</tspan>
    <tspan x="600" dy="30">and logs results to a channel.</tspan>
  </text>
</svg>